<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutsch Pop – تعلّم الألمانية</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3eeff;--card:#fff;--ink:#2a1f5c;--mute:#7b72a8;--line:#ddd3f7;--g:#2fd16b;--gd:#1ea552;--o:#ffb020;--od:#d68a00;--p:#7c4dff;--pd:#5a30d6;--r:#ff4d6d;--rd:#d12f4f;--sh:#cfc3f3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f2e;--card:#221a45;--ink:#f5f1ff;--mute:#a99fd6;--line:#3b3066;--sh:#0d0820;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150f2e;--card:#221a45;--ink:#f5f1ff;--mute:#a99fd6;--line:#3b3066;--sh:#0d0820;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo Bhaijaan 2",system-ui,sans-serif;font-weight:500}
.de{direction:ltr;unicode-bidi:isolate;display:inline-block}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.logo{font-weight:800;font-size:24px;color:var(--p)}
.chip{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:2px 12px;font-weight:800;font-size:16px}
.hero{display:flex;gap:12px;align-items:center;margin:10px 0 18px}
.ch{font-size:68px;line-height:1;animation:fl 2.6s ease-in-out infinite;filter:drop-shadow(0 6px 0 rgba(124,77,255,.18))}
.ch.jump{animation:jp .6s}.ch.shake{animation:sk .5s}
@keyframes fl{50%{transform:translateY(-8px) rotate(-4deg)}}
@keyframes jp{30%{transform:translateY(-26px) scale(1.15) rotate(8deg)}60%{transform:translateY(0) scale(.95)}}
@keyframes sk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.bub{position:relative;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px 14px;font-weight:700;font-size:17px;flex:1}
.bub::after{content:"";position:absolute;right:-16px;top:22px;border:8px solid transparent;border-left-color:var(--line)}
.bub::before{content:"";position:absolute;right:-12px;top:22px;border:8px solid transparent;border-left-color:var(--card);z-index:1}
.path{display:flex;flex-direction:column;gap:16px}
.unit{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-bottom:6px solid var(--line);border-radius:24px;padding:14px;cursor:pointer;width:88%;font:inherit;color:inherit;text-align:start}
.unit:active{transform:translateY(3px);border-bottom-width:3px}
.unit[disabled]{opacity:.5;cursor:not-allowed}
.bd{width:70px;height:70px;border-radius:22px;display:grid;place-items:center;font-size:42px;flex:none;border-bottom:5px solid rgba(0,0,0,.18);overflow:hidden}
.bd svg{width:64px;height:auto;margin-top:10px}
.unit h3{margin:0;font-size:21px}.unit p{margin:0;color:var(--mute);font-size:15px}
.stars{font-size:18px;letter-spacing:2px}
.btn{font:inherit;font-weight:800;font-size:19px;border:0;border-radius:18px;padding:12px 22px;color:#fff;background:var(--g);border-bottom:5px solid var(--gd);cursor:pointer;width:100%}
.btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.btn:disabled{background:var(--line);border-bottom-color:var(--sh);color:var(--mute);cursor:not-allowed}
.btn.p{background:var(--p);border-bottom-color:var(--pd)}.btn.o{background:var(--o);border-bottom-color:var(--od)}
.lt{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.x{font:inherit;font-size:22px;background:none;border:0;color:var(--mute);cursor:pointer}
.pb{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--g),#8cf04a);border-radius:99px;transition:width .4s}
.q{margin:14px 0 130px;display:flex;flex-direction:column;gap:12px}
.big{font-size:44px;font-weight:800;text-align:center;margin:4px 0}
.sub{text-align:center;color:var(--mute);font-size:22px}
.spk{align-self:center;font-size:34px;width:84px;height:84px;border-radius:50%;border:0;background:var(--p);border-bottom:6px solid var(--pd);color:#fff;cursor:pointer}
.spk.on{animation:pu 1s infinite;background:var(--r);border-bottom-color:var(--rd)}
@keyframes pu{50%{transform:scale(1.12)}}
.opt{font:inherit;font-size:20px;font-weight:700;color:var(--ink);background:var(--card);border:2px solid var(--line);border-bottom:5px solid var(--line);border-radius:18px;padding:13px;cursor:pointer;text-align:center}
.opt.sel{border-color:var(--p);background:rgba(124,77,255,.12);border-bottom-color:var(--p)}
.opt.ok{border-color:var(--g);background:rgba(47,209,107,.18);border-bottom-color:var(--g)}
.opt.no{border-color:var(--r);background:rgba(255,77,109,.16);border-bottom-color:var(--r)}
input.t{font:inherit;font-size:28px;font-weight:700;direction:ltr;text-align:center;width:100%;padding:12px;border-radius:18px;border:2px solid var(--line);border-bottom:5px solid var(--line);background:var(--card);color:var(--ink);outline:0}
input.t:focus{border-color:var(--p)}
.um{display:flex;gap:8px;justify-content:center}.um button{font:inherit;font-size:22px;font-weight:800;width:52px;height:46px;border-radius:14px;border:2px solid var(--line);border-bottom:4px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.heard{text-align:center;font-size:20px;min-height:30px;color:var(--mute)}
.skip{background:none;border:0;font:inherit;color:var(--mute);text-decoration:underline;cursor:pointer;align-self:center}
.ft{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);transition:background .2s}
.ft>div{max-width:520px;margin:auto}
.fb{font-weight:800;font-size:20px;margin-bottom:8px;min-height:26px;display:none}
.ft.ok{background:#c9f7da;color:#0d6b33}.ft.no{background:#ffd6de;color:#a3173a}
.ft.ok .fb,.ft.no .fb{display:block}
.ft.no .btn{background:var(--r);border-bottom-color:var(--rd)}
.res{text-align:center;padding-top:30px}.res .ch{font-size:110px;display:flex;justify-content:center}
.res .ch svg{width:130px;height:auto}
.res h2{font-size:34px;margin:10px 0}
.st{display:flex;gap:10px;justify-content:center;margin:16px 0 24px}
.st div{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 18px;font-weight:800;font-size:20px}
.st small{display:block;color:var(--mute);font-size:14px}
.cf{position:fixed;top:-30px;font-size:26px;pointer-events:none;animation:fa 2.6s linear forwards;z-index:9}
@keyframes fa{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.ch,.spk.on{animation:none}}
.plan{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:12px 14px;margin-bottom:14px}.plan b{font-size:18px}.plan .pb{height:12px;margin:8px 0}.plan small{color:var(--mute)}
.warn{background:#ffe3a3;color:#6b4300;border-radius:16px;padding:8px 12px;font-weight:700;margin-bottom:12px}
.acts{display:flex;gap:8px;margin-bottom:14px}.acts .btn{font-size:14px;padding:10px 4px}
.lvh{font-weight:800;font-size:22px;color:var(--p);margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin:8px 0;text-align:start}
button.row{font:inherit;color:inherit;cursor:pointer;width:100%}
.row button{font:inherit;font-weight:800;border:0;background:var(--p);color:#fff;border-radius:12px;padding:6px 12px;cursor:pointer;direction:ltr;flex:none}
.hint{text-align:center;color:var(--mute);font-size:15px}
.card{background:var(--card);border:2px solid var(--line);border-bottom:6px solid var(--line);border-radius:24px;padding:22px 16px;text-align:center;animation:ci .35s ease}
@keyframes ci{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.cardemoji{font-size:64px;line-height:1}
.cardde{font-size:38px;font-weight:800;margin:10px 0 4px;direction:ltr;unicode-bidi:isolate}
.cardar{font-size:22px;color:var(--mute);margin-bottom:8px}
.cardhint{font-size:15px;color:var(--p);font-weight:700;min-height:22px;margin-bottom:10px}
.gbody{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px;line-height:1.65;margin:10px 0}
.gbody h3{color:var(--p);margin:14px 0 8px;font-size:19px}
.gbody h3:first-child{margin-top:0}
.gbody p{margin:6px 0}
.gbody ul.lst{margin:8px 0;padding-inline-start:22px}
</style>
</head>
<body>
<div id="app">
 <div id="home" hidden></div>
 <div id="lesson" hidden>
  <div class="lt"><button class="x" id="quit" aria-label="خروج">✕</button><div class="pb"><div id="bar"></div></div><div class="chip" id="hr"></div></div>
  <div class="hero"><div class="ch" id="lc"></div><div class="bub" id="lb"></div></div>
  <div class="q" id="q"></div>
  <div class="ft" id="ft"><div><div class="fb" id="fb"></div><button class="btn" id="go" disabled>تحقق</button></div></div>
 </div>
 <div id="learn" hidden></div>
 <div id="end" hidden></div>
</div>
<script>
const LV=[["A1","مبتدئ"],["A2","أساسي"],["B1","متوسط"],["B2","متقدم"]],LC=["#2fd16b","#ffb020","#4dc3ff","#ff6fae"];
const CHS=[["بلوبي","🟣"],["نقنق","🐸"],["فرفور","🦊"],["بومبو","🦉"]];
/* ===== شخصيات كرتونية (ماشي بشر) ===== */
function av(k,m=0){
  const ey=(cx1,cx2,cy,r=7,pr=3.5)=>{
    if(m==2) return `<path d="M${cx1-r} ${cy}L${cx1+r} ${cy}" stroke="#2a1f5c" stroke-width="3" stroke-linecap="round"/><path d="M${cx2-r} ${cy}L${cx2+r} ${cy}" stroke="#2a1f5c" stroke-width="3" stroke-linecap="round"/>`;
    if(m==1) return `<path d="M${cx1-r} ${cy}q${r} ${-r*0.8} ${r*2} 0" stroke="#2a1f5c" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M${cx2-r} ${cy}q${r} ${-r*0.8} ${r*2} 0" stroke="#2a1f5c" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    return `<circle cx="${cx1}" cy="${cy}" r="${r}" fill="#fff"/><circle cx="${cx2}" cy="${cy}" r="${r}" fill="#fff"/><circle cx="${cx1+1}" cy="${cy+1}" r="${pr}" fill="#2a1f5c"/><circle cx="${cx2+1}" cy="${cy+1}" r="${pr}" fill="#2a1f5c"/><circle cx="${cx1+2}" cy="${cy-1}" r="1.3" fill="#fff"/><circle cx="${cx2+2}" cy="${cy-1}" r="1.3" fill="#fff"/>`;
  };
  const mo=(cx,cy,w=22,h=10)=>{
    if(m==2) return `<path d="M${cx-w/2} ${cy+h/2}q${w/2} ${-h} ${w} 0" stroke="#2a1f5c" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    if(m==1) return `<path d="M${cx-w/2} ${cy}q${w/2} ${h} ${w} 0" stroke="#2a1f5c" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    return `<path d="M${cx-w/3} ${cy}q${w/3} ${h/2} ${w*2/3} 0" stroke="#2a1f5c" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  };
  const B=[
    `<path d="M50 15 Q25 15 22 45 Q20 75 30 95 L70 95 Q80 75 78 45 Q75 15 50 15Z" fill="#9b6bff"/>
     <path d="M32 22 L25 6 L40 16Z" fill="#7c4dff"/><path d="M68 22 L75 6 L60 16Z" fill="#7c4dff"/>
     <ellipse cx="35" cy="98" rx="9" ry="5" fill="#7c4dff"/><ellipse cx="65" cy="98" rx="9" ry="5" fill="#7c4dff"/>
     ${ey(40,60,52)}${mo(50,74)}
     <circle cx="30" cy="66" r="5" fill="#ff8aa5" opacity=".45"/><circle cx="70" cy="66" r="5" fill="#ff8aa5" opacity=".45"/>`,
    `<ellipse cx="50" cy="65" rx="32" ry="30" fill="#4cd964"/>
     <circle cx="32" cy="32" r="15" fill="#4cd964"/><circle cx="68" cy="32" r="15" fill="#4cd964"/>
     <ellipse cx="50" cy="76" rx="20" ry="15" fill="#a8f0b5"/>
     <ellipse cx="26" cy="94" rx="11" ry="6" fill="#2fb54a"/><ellipse cx="74" cy="94" rx="11" ry="6" fill="#2fb54a"/>
     ${ey(32,68,32,9,4.5)}${mo(50,72,26,12)}
     <circle cx="22" cy="68" r="5" fill="#ff8aa5" opacity=".45"/><circle cx="78" cy="68" r="5" fill="#ff8aa5" opacity=".45"/>`,
    `<path d="M20 42 L14 12 L40 30Z" fill="#ff9f43"/><path d="M80 42 L86 12 L60 30Z" fill="#ff9f43"/>
     <path d="M22 36 L18 20 L33 30Z" fill="#ffd0a1"/><path d="M78 36 L82 20 L67 30Z" fill="#ffd0a1"/>
     <ellipse cx="50" cy="60" rx="32" ry="32" fill="#ff9f43"/>
     <ellipse cx="50" cy="72" rx="20" ry="16" fill="#ffd0a1"/>
     <ellipse cx="50" cy="66" rx="4" ry="3" fill="#2a1f5c"/>
     ${ey(40,60,52)}${mo(50,80,18,8)}
     <circle cx="26" cy="64" r="5" fill="#ff8aa5" opacity=".45"/><circle cx="74" cy="64" r="5" fill="#ff8aa5" opacity=".45"/>`,
    `<ellipse cx="50" cy="62" rx="32" ry="36" fill="#4dc3ff"/>
     <path d="M22 32 L16 8 L36 26Z" fill="#4dc3ff"/><path d="M78 32 L84 8 L64 26Z" fill="#4dc3ff"/>
     <ellipse cx="50" cy="78" rx="22" ry="18" fill="#a8e0ff"/>
     <ellipse cx="18" cy="72" rx="7" ry="16" fill="#1a9be0"/><ellipse cx="82" cy="72" rx="7" ry="16" fill="#1a9be0"/>
     ${ey(38,62,48,11,5)}
     <path d="M45 62 L55 62 L50 72Z" fill="#ffb020"/>
     ${m==1?'<path d="M42 78q8 6 16 0" stroke="#2a1f5c" stroke-width="2.5" fill="none" stroke-linecap="round"/>':m==2?'<path d="M44 80q6-4 12 0" stroke="#2a1f5c" stroke-width="2.5" fill="none" stroke-linecap="round"/>':''}
     <circle cx="26" cy="64" r="4" fill="#ff8aa5" opacity=".45"/><circle cx="74" cy="64" r="4" fill="#ff8aa5" opacity=".45"/>`
  ];
  return `<svg viewBox="0 0 100 110" width="84" height="92" aria-hidden="true">${B[k%4]}</svg>`;
}
/* ===== المحتوى (ترجمة فصحى + أرقام لاتينية) ===== */
const D=`A1|التحيات والأدب|👋|Hallo=مرحباً;Guten Tag=يومك سعيد;Tschüss=وداعاً;Danke=شكراً;Bitte=من فضلك;Ja=نعم;Nein=لا;Entschuldigung=المعذرة
A1|أنا وأنت|🙋|ich=أنا;du=أنت;sein=يكون;haben=يملك;heißen=يُسمّى;kommen=يأتي;wohnen=يسكن;sprechen=يتحدث
A1|الأرقام|🔢|eins=1=1️⃣;zwei=2=2️⃣;drei=3=3️⃣;vier=4=4️⃣;fünf=5=5️⃣;sechs=6=6️⃣;sieben=7=7️⃣;acht=8=8️⃣
A1|المأكولات والمشروبات|🍞|Wasser=ماء;Brot=خبز;Apfel=تفاحة;Käse=جبن;Kaffee=قهوة;Milch=حليب;Fleisch=لحم;Reis=أرز
A2|العائلة|👨‍👩‍👧|Mutter=أم;Vater=أب;Bruder=أخ;Schwester=أخت;Kind=طفل;Freund=صديق;Mann=رجل;Frau=امرأة
A2|المدينة|🏙️|Stadt=مدينة;Haus=منزل;Straße=شارع;Bahnhof=محطة القطار;Schule=مدرسة;Arbeit=عمل;Geschäft=متجر;Park=حديقة
A2|الوقت|⏰|heute=اليوم;morgen=غداً;gestern=أمس;Woche=أسبوع;Montag=الإثنين;Uhr=ساعة;Zeit=وقت;Tag=يوم
A2|أفعال يومية|🏃|gehen=يمشي;essen=يأكل;trinken=يشرب;machen=يفعل;lernen=يتعلم;kaufen=يشتري;arbeiten=يعمل;schlafen=ينام
B1|مشاعر وصفات|😊|glücklich=سعيد;traurig=حزين;müde=متعب;wichtig=مهم;schwierig=صعب;einfach=سهل;interessant=ممتع;teuer=غالي
B1|السفر|✈️|Reise=رحلة;Flug=طيران;Zug=قطار;Hotel=فندق;Urlaub=عطلة;Koffer=حقيبة;Fahrkarte=تذكرة;Ausweis=بطاقة هوية
B1|الصحة|🩺|Arzt=طبيب;Krankenhaus=مستشفى;Medikament=دواء;Schmerzen=ألم;Fieber=حمى;gesund=معافى;krank=مريض;Termin=موعد
B1|العمل|💼|Beruf=مهنة;Chef=مدير;Gehalt=راتب;Bewerbung=طلب توظيف;Erfahrung=خبرة;Besprechung=اجتماع;Kollege=زميل;Vertrag=عقد
B2|المجتمع|🌍|Gesellschaft=مجتمع;Regierung=حكومة;Meinung=رأي;Umwelt=بيئة;Zukunft=مستقبل;Verantwortung=مسؤولية;Entwicklung=تطور;Unterschied=فرق
B2|أدوات الربط|🔗|obwohl=رغم أن;deshalb=لهذا;trotzdem=مع ذلك;außerdem=بالإضافة إلى ذلك;während=بينما;damit=لكي;sondern=بل;allerdings=لكن
B2|أفعال متقدمة|🧠|entscheiden=يقرر;vermeiden=يتجنب;erreichen=يحقق;behaupten=يزعم;verbessern=يحسّن;vergleichen=يقارن;überzeugen=يقنع;vorschlagen=يقترح
B2|تعبيرات للنقاش|💬|einerseits=من جهة;andererseits=من جهة أخرى;zum Beispiel=مثلاً;auf jeden Fall=بكل تأكيد;im Gegensatz zu=على عكس;es kommt darauf an=يعتمد الأمر;meiner Meinung nach=في رأيي;zusammenfassend=خلاصة القول`;
const U=D.split("\n").map((l,i)=>{const[lv,n,ic,w]=l.split("|");return{id:i+1,lv:"A1A2B1B2".indexOf(lv)/2,n,ic,w:w.split(";").map(x=>{const p=x.split("=");return[p[0],p[1],p[2]||ic]})}});
const ALL=U.flatMap(u=>u.w),T=["pick","listen","type","speak"];
const PH=[[/sch/i,"sch = ش","Schule"],[/(^|[^s])ch/i,"ch = خ / ش خفيفة","ich / Buch"],[/ü/i,"ü = ي بشفاه مدوّرة","über"],[/ö/i,"ö = e بشفاه مدوّرة","schön"],[/z/i,"z = تس","Zeit"],[/w/i,"w = ڤ","Wasser"],[/v/i,"v = ف","Vater"],[/ß/i,"ß = س قوية","heißen"],[/ie/i,"ie = ي طويلة","Bier"],[/ei/i,"ei = آي","nein"],[/eu|äu/i,"eu/äu = أوي","Euro"],[/^s[pt]/i,"sp/st = شب/شت","Stadt"],[/r/i,"r = راء من الحلق","rot"]];
const hint=w=>PH.filter(p=>p[0].test(w)).slice(0,2).map(p=>p[1]).join(" · ");
const GR=[
 {ic:"🔤",t:"النطق والحروف",b:`
  <h3>حروف خاصة</h3>
  <div class="row"><span><b>ä</b> = e مفتوحة</span><button data-s="Mädchen">🔊 Mädchen</button></div>
  <div class="row"><span><b>ö</b> = e بشفاه مدوّرة</span><button data-s="schön">🔊 schön</button></div>
  <div class="row"><span><b>ü</b> = ي بشفاه مدوّرة</span><button data-s="über">🔊 über</button></div>
  <div class="row"><span><b>ß</b> = س قوية</span><button data-s="heißen">🔊 heißen</button></div>
  <h3>أصوات مركّبة</h3>
  <ul class="lst"><li><b>sch</b> = ش</li><li><b>ch</b> = خ بعد a/o/u · ش خفيفة بعد i/e</li><li><b>ei</b> = آي</li><li><b>ie</b> = ي طويلة</li><li><b>eu/äu</b> = أوي</li><li><b>z</b> = تس</li><li><b>w</b> = ڤ</li><li><b>v</b> = ف</li><li><b>sp</b> في البداية = شب</li><li><b>st</b> في البداية = شت</li></ul>`},
 {ic:"📝",t:"أدوات التعريف",b:`
